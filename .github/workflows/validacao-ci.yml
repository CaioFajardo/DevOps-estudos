name: Pipeline Projeto DevOps

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main"]

jobs:
  inspecao-e-validacao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Explorando o Runner (SO e RAM)
        run: |
          lsb_release -a
          free -h

      - name: Verificar arquivos essenciais
        run: |
          test -f index.html && echo "HTML encontrado!" &&
          test -f style.css && echo "CSS encontrado!"